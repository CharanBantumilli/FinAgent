services:
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379", "3000:3000"]   # 3000 = FalkorDB Browser
    volumes: ["falkordb_data:/data"]
  app:
    build: .
    depends_on: [falkordb]
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      FALKORDB_HOST: falkordb
volumes:
  falkordb_data:
